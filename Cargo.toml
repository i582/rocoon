[package]
name = "rocoon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
hex = "0.4"
rand = "0.8"
rcgen = { version = "0.13", features = ["crypto", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-proto = "0.5"
toml = "0.8"
