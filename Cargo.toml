[workspace]
members = [
    "crates/rocoon-client",
    "crates/rocoon-openai-server",
    "crates/rocoon-protocol",
    "crates/rocoon-transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/i582/rocoon"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# `ton_core` pulls `ton_macros`, whose proc-macro stack currently resolves a
# few dependency families in multiple versions. This is not actionable in
# rocoon without forking ton-rs.
multiple_crate_versions = "allow"

unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"

[workspace.dependencies]
rocoon-client = { path = "crates/rocoon-client" }
rocoon-openai-server = { path = "crates/rocoon-openai-server" }
rocoon-protocol = { path = "crates/rocoon-protocol" }
rocoon-transport = { path = "crates/rocoon-transport" }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2.2"
rand = "0.8"
rcgen = { version = "0.13", features = ["crypto", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-proto = "0.5"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
ton = "0.1.5"
ton_core = "0.1.1"
toml = "0.8"

[package]
name = "rocoon"
version.workspace = true
edition.workspace = true
description = "Minimal Rust bridge for the Cocoon proxy protocol."
repository.workspace = true
license.workspace = true
keywords = ["cocoon", "ton", "openai", "proxy"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
rocoon-client = { workspace = true }
rocoon-openai-server = { workspace = true }
